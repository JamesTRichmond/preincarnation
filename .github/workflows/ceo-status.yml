name: CEO status

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Rewrite STATUS.md to this tip
        run: |
          if git log -1 --format=%s | grep -q "Rewrite CEO STATUS"; then
            echo "already current"
            exit 0
          fi
          node scripts/write-ceo-status.mjs
      - name: Commit when the tip moved
        run: |
          git diff --quiet -- support/ceo/STATUS.md && exit 0
          git config user.name "preincarnation-status"
          git config user.email "status@users.noreply.github.com"
          git add support/ceo/STATUS.md
          git commit -m "Rewrite CEO STATUS to the current tip."
          git push
